<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MindX - AI Search Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/smoothscroll-polyfill@0.4.4/dist/smoothscroll.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* ──────────────────── HEADER ──────────────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid rgba(0, 255, 65, 0.15);
            backdrop-filter: blur(10px);
            z-index: 100;
            height: 70px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #e0e0e0 0%, #00FF41 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-controls button {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            color: #999;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .header-controls button:hover {
            background: rgba(0, 255, 65, 0.15);
            color: #00FF41;
            border-color: #00FF41;
        }

        /* ──────────────────── MAIN LAYOUT ──────────────────── */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ──────────────────── SIDEBAR ──────────────────── */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.5);
            border-right: 1px solid rgba(0, 255, 65, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 255, 65, 0.2) transparent;
            backdrop-filter: blur(10px);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.2);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.4);
        }

        .sidebar-header {
            padding: 24px 16px 16px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.05);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00FF41 0%, #00cc33 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 255, 65, 0.2);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 255, 65, 0.35);
        }

        .sidebar-history {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .history-group-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 12px 8px 8px;
            margin-top: 12px;
        }

        .history-item {
            padding: 10px 12px;
            background: rgba(0, 255, 65, 0.02);
            border: 1px solid rgba(0, 255, 65, 0.05);
            border-radius: 8px;
            margin: 6px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item:hover {
            background: rgba(0, 255, 65, 0.08);
            border-color: rgba(0, 255, 65, 0.2);
            color: #00FF41;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(0, 255, 65, 0.05);
            font-size: 11px;
            color: #666;
            text-align: center;
        }

        /* ──────────────────── CHAT AREA ──────────────────── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(26, 26, 46, 0.4));
            position: relative;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.15);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.3);
        }

        /* ──────────────────── EMPTY STATE ──────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 32px;
            padding: 40px;
        }

        .empty-state-icon {
            font-size: 64px;
            opacity: 0.6;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .empty-state-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #e0e0e0 0%, #00FF41 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: #999;
            max-width: 400px;
            margin: 0;
            line-height: 1.6;
        }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .quick-prompt {
            padding: 14px 16px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
            transition: all 0.3s ease;
            text-align: left;
            line-height: 1.4;
        }

        .quick-prompt:hover {
            background: rgba(0, 255, 65, 0.1);
            border-color: #00FF41;
            color: #00FF41;
            transform: translateY(-2px);
        }

        /* ──────────────────── MESSAGES ──────────────────── */
        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 65%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #00FF41, #00dd34);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: rgba(0, 255, 65, 0.06);
            border: 1px solid rgba(0, 255, 65, 0.15);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-content a {
            color: #00FF41;
            text-decoration: none;
        }

        .message-content a:hover {
            text-decoration: underline;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            color: #00FF41;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid rgba(0, 255, 65, 0.1);
        }

        .message-content pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        /* ──────────────────── INPUT AREA ──────────────────── */
        .input-area {
            padding: 24px 32px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: rgba(0, 255, 65, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background: rgba(0, 255, 65, 0.05);
            border-color: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .input-icons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .icon-btn:hover {
            color: #00FF41;
            background: rgba(0, 255, 65, 0.1);
            transform: scale(1.1);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 150px;
            min-height: 20px;
        }

        .input-field::placeholder {
            color: #666;
        }

        .send-btn {
            background: linear-gradient(135deg, #00FF41, #00cc33);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 255, 65, 0.3);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* ──────────────────── LOADING ──────────────────── */
        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: rgba(0, 255, 65, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 65, 0.1);
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: #00FF41;
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .loading-text {
            font-size: 13px;
            color: #00FF41;
        }

        /* ──────────────────── FILE INPUT ──────────────────── */
        #file-input {
            display: none;
        }

        /* ──────────────────── MOBILE ──────────────────── */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                position: absolute;
                left: 0;
                height: 100%;
                z-index: 200;
                border-right: none;
                transition: width 0.3s ease;
            }

            .sidebar.open {
                width: 250px;
            }

            .message-content {
                max-width: 85%;
            }

            .empty-state {
                padding: 20px;
            }

            .quick-prompts {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 12px 16px;
                height: 60px;
            }

            .logo {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="logo">MindX</div>
            <div class="header-controls">
                <button id="menu-btn" style="display: none;">☰ Menu</button>
                <button onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- SIDEBAR -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
                </div>

                <div class="sidebar-history" id="history-container">
                    <p style="text-align: center; color: #666; font-size: 12px; padding: 20px 0;">No history yet</p>
                </div>

                <div class="sidebar-footer">
                    v2.0 © 2026 MindX
                </div>
            </div>

            <!-- CHAT AREA -->
            <div class="chat-area">
                <div class="messages-container" id="messages-container"></div>

                <!-- INPUT -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <div class="input-icons">
                            <button class="icon-btn" onclick="document.getElementById('file-input').click();" title="Upload file">📎</button>
                            <button class="icon-btn" onclick="toggleVoice();" title="Voice input" id="voice-btn">🎤</button>
                        </div>
                        <textarea class="input-field" id="message-input" placeholder="What would you like to know?" rows="1"></textarea>
                        <button class="send-btn" onclick="sendMessage();">⬆</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" multiple onchange="handleFileUpload(event)">

    <script>
        const token = localStorage.getItem('mindx_token');
        if (!token) window.location.href = '/login.html';

        let currentSessionId = localStorage.getItem('currentSessionId') || uuid.v4();
        localStorage.setItem('currentSessionId', currentSessionId);
        let isRecording = false;

        // ─── INIT ───
        window.addEventListener('load', () => {
            renderEmptyState();
            loadHistory();
            setupInputHandlers();
        });

        function setupInputHandlers() {
            const input = document.getElementById('message-input');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
                if (e.key === 'Enter' && e.shiftKey) {
                    // Allow new line
                }
            });
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 150) + 'px';
            });
        }

        // ─── EMPTY STATE ───
        function renderEmptyState() {
            const container = document.getElementById('messages-container');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">✨</div>
                    <div>
                        <h1 class="empty-state-title">What's on your mind?</h1>
                        <p class="empty-state-subtitle">Ask me anything. I can search the web, analyze documents, or just chat.</p>
                    </div>
                    <div class="quick-prompts">
                        <div class="quick-prompt" onclick="setInput('What are the latest AI breakthroughs?')">📰 Latest AI news</div>
                        <div class="quick-prompt" onclick="setInput('Explain quantum computing')">🔬 Quantum computing</div>
                        <div class="quick-prompt" onclick="setInput('Best practices for API design')">💻 API design tips</div>
                        <div class="quick-prompt" onclick="setInput('How to learn web development?')">🌐 Web development</div>
                    </div>
                </div>
            `;
        }

        function setInput(text) {
            document.getElementById('message-input').value = text;
            document.getElementById('message-input').focus();
            sendMessage();
        }

        // ─── MESSAGES ───
        function addMessage(content, role) {
            const container = document.getElementById('messages-container');
            
            // Clear empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                container.innerHTML = '';
            }

            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';

            if (role === 'assistant') {
                contentEl.innerHTML = marked.parse(content);
                setTimeout(() => {
                    Prism.highlightAllUnder(contentEl);
                    renderMermaidDiagrams(contentEl);
                }, 50);
            } else {
                contentEl.textContent = content;
            }

            messageEl.appendChild(contentEl);
            container.appendChild(messageEl);
            scrollToBottom();
        }

        function renderMermaidDiagrams(container) {
            container.querySelectorAll('.language-mermaid').forEach((block, i) => {
                const code = block.textContent;
                const div = document.createElement('div');
                div.id = `mermaid-${Date.now()}-${i}`;
                block.parentElement.replaceWith(div);
                try {
                    mermaid.render(div.id, code).then(({ svg }) => { div.innerHTML = svg; });
                } catch (e) { console.error('Mermaid error:', e); }
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-container');
            setTimeout(() => container.scrollTop = container.scrollHeight, 100);
        }

        // ─── SEND MESSAGE ───
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            input.style.height = 'auto';

            // Show loading
            const container = document.getElementById('messages-container');
            const loadingEl = document.createElement('div');
            loadingEl.className = 'message assistant';
            loadingEl.innerHTML = `
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dots">
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                        </div>
                        <span class="loading-text">Thinking...</span>
                    </div>
                </div>
            `;
            container.appendChild(loadingEl);
            scrollToBottom();

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        query: text,
                        session_id: currentSessionId
                    })
                });

                loadingEl.remove();

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.answer, 'assistant');
                    loadHistory();
                }
            } catch (e) {
                loadingEl.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
            }
        }

        // ─── HISTORY ───
        async function loadHistory() {
            try {
                const res = await fetch('/chats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    renderHistory(data);
                }
            } catch (e) { }
        }

        function renderHistory(data) {
            const container = document.getElementById('history-container');

            if (!data?.groups?.length) {
                container.innerHTML = '<p style="text-align: center; color: #666; font-size: 12px; padding: 20px 0;">No history yet</p>';
                return;
            }

            let html = '';
            data.groups.slice(0, 2).forEach(group => {
                html += `<div class="history-group-label">${group.label}</div>`;
                group.sessions.slice(0, 5).forEach(session => {
                    html += `<div class="history-item" onclick="loadSession('${session.session_id}')" title="${session.title}">${session.title || 'Untitled'}</div>`;
                });
            });

            container.innerHTML = html;
        }

        async function loadSession(sid) {
            currentSessionId = sid;
            localStorage.setItem('currentSessionId', sid);

            const container = document.getElementById('messages-container');
            container.innerHTML = '<p style="text-align: center; color: #666;">Loading...</p>';

            try {
                const response = await fetch(`/chats/${sid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    container.innerHTML = '';

                    data.messages.forEach(msg => {
                        addMessage(msg.query, 'user');
                        addMessage(msg.answer, 'assistant');
                    });
                }
            } catch (e) { }
        }

        function startNewChat() {
            currentSessionId = uuid.v4();
            localStorage.setItem('currentSessionId', currentSessionId);
            document.getElementById('messages-container').innerHTML = '';
            renderEmptyState();
        }

        // ─── FILE UPLOAD ───
        async function handleFileUpload(event) {
            const files = event.target.files;
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('session_id', currentSessionId);

                try {
                    await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                } catch (e) { }
            }
        }

        // ─── VOICE ───
        function toggleVoice() {
            // Placeholder for voice functionality
            console.log('Voice input not yet implemented');
        }

        // ─── LOGOUT ───
        function handleLogout() {
            localStorage.clear();
            window.location.href = '/login.html';
        }

        // ─── MOBILE MENU ───
        document.getElementById('menu-btn')?.addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Show menu button on mobile
        window.addEventListener('resize', () => {
            document.getElementById('menu-btn').style.display = window.innerWidth <= 768 ? 'block' : 'none';
        });
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
