<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | MindX</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00FF41",
                        "background-dark": "#050804",
                        "surface-dark": "rgba(14, 31, 16, 0.6)",
                        "border-dark": "rgba(41, 73, 34, 0.4)",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        :root {
            --primary: #00FF41;
            --background-dark: #050804;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-dark);
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(14, 31, 16, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 65, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 255, 65, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-glass:focus {
            border-color: var(--primary);
            background: rgba(0, 255, 65, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.1);
        }

        /* Matrix Rain Animation */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body class="text-white min-h-screen flex flex-col font-display">

    <canvas id="matrix-canvas"></canvas>

    <!-- Header -->
    <header class="w-full px-8 py-6 flex justify-center items-center z-50">
        <div class="max-w-7xl w-full flex justify-between items-center text-white">
            <a class="flex items-center gap-3 group no-underline" href="/">
                <div
                    class="size-9 bg-primary flex items-center justify-center rounded-xl shadow-[0_0_20px_rgba(0,255,65,0.4)]">
                    <span class="material-symbols-outlined text-background-dark font-bold">query_stats</span>
                </div>
                <h1 class="text-2xl font-black tracking-tighter group-hover:text-primary transition-colors">
                    Mind<span class="text-primary">X</span></h1>
            </a>
            <nav>
                <a class="text-sm font-bold text-slate-400 hover:text-primary transition-all flex items-center gap-2"
                    href="/">
                    <span class="material-symbols-outlined text-sm">arrow_back</span> Back
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 relative">
        <div class="w-full max-w-[460px] z-10">
            <!-- Login Card -->
            <div class="glass-card rounded-3xl p-10 md:p-12 relative overflow-hidden">
                <!-- Decorative top glow -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/50 to-transparent">
                </div>

                <div class="mb-10 text-center">
                    <h2 class="text-4xl font-black tracking-tight mb-3">Access Portal</h2>
                    <p class="text-slate-400 text-sm font-medium">Initialize your intelligence session.</p>
                </div>

                <!-- Error Message Area -->
                <div id="error-area"
                    class="mb-8 p-4 rounded-xl bg-red-500/10 border border-red-500/30 flex items-center gap-3 text-red-500 text-xs font-bold hidden">
                    <span class="material-symbols-outlined text-lg">error</span>
                    <span id="error-message">Incorrect login credentials.</span>
                </div>

                <form id="login-form" class="space-y-6" onsubmit="handleLogin(event)">
                    <!-- Email Field -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500 px-1"
                            for="email">Neural Identifier (Email)</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg">mail</span>
                            <input
                                class="w-full h-14 pl-12 pr-4 input-glass rounded-xl text-sm outline-none placeholder:text-slate-600"
                                id="email" placeholder="name@example.com" type="email" required />
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="space-y-2">
                        <label class="text-[11px] font-bold uppercase tracking-widest text-slate-500 px-1"
                            for="password">Security Protocol (Password)</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg">lock</span>
                            <input
                                class="w-full h-14 pl-12 pr-14 input-glass rounded-xl text-sm outline-none placeholder:text-slate-600"
                                id="password" placeholder="••••••••" type="password" required />
                            <button type="button" onclick="togglePassword()"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-primary transition-colors flex items-center justify-center p-1">
                                <span id="password-toggle-icon"
                                    class="material-symbols-outlined text-lg">visibility</span>
                            </button>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button id="login-btn"
                        class="w-full h-14 bg-primary hover:shadow-[0_0_30px_rgba(0,255,65,0.4)] text-background-dark font-black rounded-xl transition-all active:scale-[0.97] mt-4 flex items-center justify-center gap-2 group"
                        type="submit">
                        <span class="text-lg">Authorize Access</span>
                        <span
                            class="material-symbols-outlined group-hover:translate-x-1 transition-transform">bolt</span>
                    </button>
                </form>

                <!-- Footer Link -->
                <div class="mt-10 text-center pt-8 border-t border-white/5">
                    <p class="text-sm text-slate-500">
                        New entity?
                        <a class="text-primary font-bold hover:underline decoration-primary/30 underline-offset-8 ml-1"
                            href="/signup.html">Request Account</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full px-8 py-10 z-10 bg-transparent">
        <div
            class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-600">
            <p>© 2026 MindX Intelligence - System.v2.4.0</p>
            <div class="flex gap-8">
                <a class="hover:text-primary transition-colors" href="#">Encryption Policy</a>
                <a class="hover:text-primary transition-colors" href="#">Terminal Terms</a>
            </div>
        </div>
    </footer>

    <script>
        // Matrix Rain Implementation
        function initMatrix() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const characters = "0101010101ABCDEFHIJKLMNOPQRSTUVWXYZ";
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = [];

            for (let x = 0; x < columns; x++) drops[x] = 1;

            function draw() {
                ctx.fillStyle = "rgba(5, 8, 4, 0.05)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00FF41";
                ctx.font = fontSize + "px monospace";

                for (let i = 0; i < drops.length; i++) {
                    const text = characters.charAt(Math.floor(Math.random() * characters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
                        drops[i] = 0;

                    drops[i]++;
                }
            }
            setInterval(draw, 33);
        }
        initMatrix();

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function showError(msg) {
            const area = document.getElementById('error-area');
            const messageEl = document.getElementById('error-message');
            messageEl.textContent = msg;
            area.classList.remove('hidden');
            // Small vibration effect
            area.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
        }

        function hideError() {
            document.getElementById('error-area').classList.add('hidden');
        }

        // Handle login
        async function handleLogin(e) {
            e.preventDefault();
            hideError();

            const btn = document.getElementById('login-btn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Credentials required for authorization.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Authorization Pending...';

            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString(),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Authorization failed. Verify credentials.');
                }

                localStorage.setItem('mindx_token', data.access_token);
                localStorage.setItem('mindx_user', JSON.stringify({
                    email: email,
                    full_name: data.full_name
                }));
                localStorage.removeItem('mindx_active_chat'); // Force new chat on fresh login
                localStorage.removeItem('currentSessionId');

                // Add success effect before redirect
                btn.style.background = '#fff';
                btn.style.color = '#000';
                btn.textContent = 'Authorized';

                setTimeout(() => window.location.href = '/dashboard.html', 500);
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Authorize Access</span><span class="material-symbols-outlined">bolt</span>';
            }
        }

        if (localStorage.getItem('mindx_token')) {
            window.location.href = '/dashboard.html';
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('matrix-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
