version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mindx_password_2026
      POSTGRES_DB: mindx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
